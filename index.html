<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #1e293b;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
    }

    main {
      padding: 80px 20px;
    }

    h1 {
      font-size: 42px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <h2>My Website</h2>
  </header>

  <main>
    <h1>Welcome to My Website!</h1>
    <p>
      This is my first website, built with HTML.
    </p>
    <a href="https://github.com/">Explore GitHub</a>
  </main>
</body>
</html>
